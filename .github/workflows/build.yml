name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -q "*.zip" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Gradle Wrapper Version
        run: |
          # Old checksum conflict hatayein aur wrapper jar regenerate karein
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i '/distributionSha256Sum/d' gradle/wrapper/gradle-wrapper.properties
          fi
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-splash-apk
          path: app/build/outputs/apk/debug/app-debug.apk
